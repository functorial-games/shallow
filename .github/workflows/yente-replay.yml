name: Yenta conversation qualification

on:
  pull_request:
    paths:
      - 'yente/**'
      - 'examples/autogenerated/yente-conversation/**'
      - 'examples/autogenerated/yente-live-model/**'
      - 'yente-conversation.ipkg'
      - '.github/workflows/yente-replay.yml'

permissions:
  contents: read

concurrency:
  group: yente-conversation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conversation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IDRIS2_PATH: '${{ github.workspace }}/.toolchain/Idric/_/libs/prelude/build/ttc:${{ github.workspace }}/.toolchain/Idric/_/libs/base/build/ttc:${{ github.workspace }}/.toolchain/Idric/_/libs/contrib/build/ttc'
      IDRIS2_DATA: '${{ github.workspace }}/.toolchain/Idric/_/support'
      IDRIS2_LIBS: '${{ github.workspace }}/.toolchain/Idric/_/support/c'
      IDRIS2_CG: chez
      CHEZ: '${{ github.workspace }}/.toolchain/Idric/.tools/bin/scheme'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 2bce7677f513d711875e978bd6f5ad28b9e54d58
          path: .toolchain/Idric
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/flexible-pipes
          ref: 9a14ea715a9fa9a4c8f676500b7d438db68f8bbf
          path: .toolchain/flexible-pipes
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: 59cfce17ddae1178519efccf6792a3fea4d344cc
          path: .toolchain/ai-ci
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ithon
          ref: 74ab6d6044b07b76a910978437a34a6b5ac6acda
          path: .toolchain/ithon
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 8636ca713ac619945939dcfbf45f358f4c0f7adf
          path: .toolchain/catfood
          persist-credentials: false
      - name: Check the Ithon inference boundary
        env:
          ITHON_CHECK_RECEIPT: '${{ runner.temp }}/yente-ithon-checks.jsonl'
        run: .toolchain/ithon/ithon examples/autogenerated/yente-live-model/live_trial.pi check
      - name: Verify the declared CPU model host before acquisition and compilation
        run: .toolchain/ithon/ithon examples/autogenerated/yente-live-model/live_provider.pi host-check
      - name: Provision Cat Food model runtime on this build host
        run: .toolchain/ithon/ithon .toolchain/catfood/profiles/rhs-evaluation/provision.pi model-runtime '${{ github.workspace }}'
      - name: Bootstrap canonical compiler
        working-directory: .toolchain/Idric
        run: ./edric bootstrap
      - name: Build conversation executable
        run: .toolchain/Idric/idris2 --build yente-conversation.ipkg
      - name: Replay the fictional person model across a process restart
        working-directory: yente/conversation
        run: |
          candidate="$GITHUB_WORKSPACE/build/exec/yente-conversation"
          scratch=$(mktemp -d)
          csplit -s -f "$scratch/part" fixtures/person-model.tsv '/^review-source/'
          "$candidate" script "$scratch/state" "$PWD/materials" "$scratch/part00" > "$scratch/transcript"
          "$candidate" request "$scratch/state" "$PWD/materials" pair "$scratch/before"
          "$candidate" script "$scratch/state" "$PWD/materials" "$scratch/part01" >> "$scratch/transcript"
          "$candidate" request "$scratch/state" "$PWD/materials" pair "$scratch/after"
          diff -u fixtures/person-model.expected "$scratch/transcript"
          cmp "$scratch/before" "$scratch/after"
          "$candidate" request "$scratch/state" "$PWD/materials" sol-home "$scratch/intake"
          "$GITHUB_WORKSPACE/.toolchain/ithon/ithon" "$GITHUB_WORKSPACE/examples/autogenerated/yente-live-model/live_provider.pi" present "$scratch/intake" > "$scratch/context"
          grep -Fq '"record_type": "source-under-review"' "$scratch/context"
      - name: Build inherited eight-case replay
        run: .toolchain/Idric/idris2 -o yente-replay yente/replay/Main.idric
      - name: Execute inherited replay and hostile controls
        run: python3 yente/tests/verify-replay.py '${{ github.workspace }}/build/exec/yente-replay'
      - name: Build independently owned ai-ci oracle
        working-directory: .toolchain/ai-ci
        run: ../Idric/idris2 --source-dir examples/autogenerated/yente-conversation -o yente-accept examples/autogenerated/yente-conversation/Accept.idric
      - name: Build independent fresh-inference observer
        working-directory: .toolchain/ai-ci
        run: ../Idric/idris2 --source-dir examples/autogenerated/yente-conversation -o yente-live-accept examples/autogenerated/yente-conversation/Live.idric
      - name: Execute independent model codec controls
        run: .toolchain/ai-ci/build/exec/yente-live-accept check
      - name: Execute Flexible Pipes request, recorded admission and independent acceptance
        run: >-
          python3 .toolchain/flexible-pipes/scripts/run-pipeline yente-conversation
          --param candidate=${{ github.workspace }}/build/exec/yente-conversation
          --param state=${{ runner.temp }}/yente-fictional-state
          --param materials=${{ github.workspace }}/yente/conversation/materials
          --param commands=${{ github.workspace }}/yente/conversation/fixtures/family.tsv
          --param oracle=${{ github.workspace }}/.toolchain/ai-ci/build/exec/yente-accept
          --param session=lio-private
          --param request=${{ runner.temp }}/yente-model-request.txt
          --param response=${{ github.workspace }}/yente/conversation/fixtures/family-response.tsv
          --runs-root ${{ github.workspace }}/.yente-runs
      - name: Execute fresh fictional model conversations and independent observations
        env:
          ITHON_PYTHON: '${{ github.workspace }}/model-runtime/bin/python'
          ITHON_CHECK_RECEIPT: '${{ runner.temp }}/yente-ithon-checks.jsonl'
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: >-
          python3 .toolchain/flexible-pipes/scripts/run-pipeline yente-live-conversation
          --param ithon=${{ github.workspace }}/.toolchain/ithon/ithon
          --param trial=${{ github.workspace }}/examples/autogenerated/yente-live-model/live_trial.pi
          --param candidate=${{ github.workspace }}/build/exec/yente-conversation
          --param materials=${{ github.workspace }}/yente/conversation/materials
          --param evidence=${{ github.workspace }}/.yente-live/trial
          --param oracle=${{ github.workspace }}/.toolchain/ai-ci/build/exec/yente-live-accept
          --runs-root ${{ github.workspace }}/.yente-runs
      - name: Preserve actual executables and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yente-conversation-qualification
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/exec/
            .toolchain/ai-ci/build/exec/
            .yente-runs/
            .yente-live/
            provision/
            profile/
            ${{ runner.temp }}/yente-ithon-checks.jsonl
